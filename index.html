
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>Zenith AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f5f5fa;font-family:Arial,sans-serif}
button,input{font:inherit}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:265px;background:#10131d;border-right:1px solid #252938;padding:20px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold;letter-spacing:2px;font-size:18px}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a38cff,#43d6ed);display:grid;place-items:center;color:#090b12;font-size:23px}
.new{margin-top:35px;padding:13px;background:#202536;border:1px solid #343b50;border-radius:12px;color:white;text-align:left;cursor:pointer}
.history{margin-top:30px;color:#888fa3;font-size:12px}
.chatlist{margin-top:12px;color:#c4c8d4;font-size:14px}
.sidebottom{margin-top:auto;color:#a1a6b5;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:70px;border-bottom:1px solid #222635;display:flex;align-items:center;padding:0 24px;gap:15px}
.model{background:#181d2a;color:white;border:1px solid #343b50;padding:10px 13px;border-radius:10px}
.status{margin-left:auto;color:#9299aa;font-size:12px}
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:35px 18px}
.welcome{text-align:center;margin:auto 0}
.welcome .tag{font-size:11px;letter-spacing:4px;color:#a99aff}
h1{font-size:clamp(35px,6vw,55px);margin:20px 0 12px}
.gradient{background:linear-gradient(90deg,#a58cff,#4ed8ed);background-clip:text;color:transparent}
.sub{color:#9098aa;line-height:1.7}
.messages{width:100%;max-width:800px;margin:auto;display:flex;flex-direction:column;gap:20px}
.msg{padding:15px 18px;border-radius:16px;max-width:85%;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:#292442}
.ai{align-self:flex-start;background:#171c29;border:1px solid #292f40}
.composer-area{padding:15px 18px 20px}
.composer{max-width:820px;margin:auto;border:1px solid #343b50;background:#151a27;border-radius:19px;padding:10px}
textarea{width:100%;resize:none;min-height:48px;max-height:130px;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:15px}
.tools{display:flex;align-items:center;gap:9px}
.tool{background:#252b3c;border:0;color:#cbd0df;padding:10px 13px;border-radius:10px;cursor:pointer}
.send{margin-left:auto;background:linear-gradient(135deg,#a38cff,#4bd3eb);color:#080b13;border:0;padding:11px 19px;border-radius:11px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.hint{text-align:center;color:#626a7c;font-size:11px;margin-top:12px}
#file{display:none}
.menu{display:none;background:none;border:0;color:white;font-size:23px}

@media(max-width:650px){
.sidebar{position:fixed;z-index:5;left:-280px;top:0;bottom:0;transition:.2s}
.sidebar.open{left:0}
.menu{display:block}
.topbar{padding:0 15px}
.status{display:none}
.content{padding:20px 12px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">Z</div>
    ZENITH AI
  </div>

  <button class="new" onclick="newChat()">＋ New conversation</button>

  <div class="history">WORKSPACE</div>
  <div class="chatlist" id="history">Your conversations will appear here.</div>

  <div class="sidebottom">
    <p>◈ Zenith AI</p>
    <p>Personal AI workspace</p>
    <p>Settings · Coming soon</p>
  </div>
</aside>

<section class="main">

  <header class="topbar">
    <button class="menu" onclick="toggleMenu()">☰</button>

    <select class="model" id="model">
      <option>Zenith Auto</option>
      <option>Zenith Core</option>
      <option>Zenith Creative</option>
    </select>

    <div class="status">● Zenith workspace</div>
  </header>

  <div class="content" id="content">

    <div class="welcome" id="welcome">
      <div class="tag">A NEW INTELLIGENCE</div>
      <h1>Think beyond.<br><span class="gradient">Go Zenith.</span></h1>
      <p class="sub">What would you like to explore today?</p>
    </div>

    <div class="messages" id="messages"></div>

  </div>

  <div class="composer-area">
    <div class="composer">

      <textarea id="prompt" placeholder="Ask Zenith anything..." rows="2"></textarea>

      <div class="tools">
        <label class="tool" for="file">＋ Attach</label>
        <input id="file" type="file" accept="image/*,.pdf,.txt,.doc,.docx">

        <button class="tool" onclick="alert('Image generation will be connected in a future build.')">
          ✧ Create
        </button>

        <button class="send" id="sendButton" onclick="sendMessage()">
          Send ↗
        </button>
      </div>

    </div>

    <div class="hint">Zenith AI can make mistakes. Verify important information.</div>
  </div>

</section>
</div>

<script>
const API_URL="https://zenith-ai-backend-1q7e.onrender.com";

const promptBox=document.getElementById("prompt");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const historyBox=document.getElementById("history");
const sendButton=document.getElementById("sendButton");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  messages.appendChild(div);
  document.getElementById("content").scrollTop=999999;
  return div;
}

// Temporary connection diagnostic
async function testConnection(){
  const box=addMessage("Testing connection to Zenith...","ai");

  try{
    const response=await fetch(API_URL+"/health");

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();
    box.textContent="CONNECTED!\n"+JSON.stringify(data);

  }catch(error){
    box.textContent="CONNECTION FAILED!\n"+
      error.name+": "+error.message;
  }
}

async function sendMessage(){
  const value=promptBox.value.trim();

  if(!value || sendButton.disabled)return;

  welcome.style.display="none";
  addMessage(value,"user");
  promptBox.value="";
  historyBox.textContent="Conversation started";
  sendButton.disabled=true;

  const replyBubble=addMessage("Zenith is thinking...","ai");

  try{
    const response=await fetch(API_URL+"/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:value})
    });

    if(!response.ok){
      throw new Error("Server returned status "+response.status);
    }

    const data=await response.json();

    replyBubble.textContent=data.reply ||
      "The backend responded, but no reply was returned.";

  }catch(error){
    replyBubble.textContent=
      "Couldn't reach Zenith's backend. ("+
      error.name+": "+error.message+")";
  }finally{
    sendButton.disabled=false;
    promptBox.focus();
  }
}

function newChat(){
  messages.innerHTML="";
  welcome.style.display="block";
  historyBox.textContent="Your conversations will appear here.";
  promptBox.value="";
  document.getElementById("sidebar").classList.remove("open");
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

promptBox.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("file").addEventListener("change",e=>{
  if(e.target.files.length){
    alert("Selected: "+e.target.files[0].name+
    ". File processing will be added in a future build.");
  }
});

// Run connection test when the page loads
testConnection();
</script>

</body>
</html>
